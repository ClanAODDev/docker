;log_level = debug
error_log = /var/log/php-fpm/error.log

[www]
listen = 127.0.0.1:9084
listen.allowed_clients = 127.0.0.1
user = nginx
group = nginx

;prefix = /path/to/pools/$pool

pm = dynamic
pm.max_children = 50
pm.start_servers = 3
pm.min_spare_servers = 3
pm.max_spare_servers = 8
;pm.process_idle_timeout = 10s;
pm.max_requests = 500
;pm.status_path = /status

;access.log = log/$pool.access.log
;access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
slowlog = /var/log/php-fpm/www-slow.log

;clear_env = no

security.limit_extensions = .php .php3 .php4 .php5 .php7 .php8

env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

;php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i -f www@my.domain.com
;catch_workers_output = yes
;php_flag[display_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 512M
php_admin_value[max_input_vars] = 10000

; Set data paths to directories owned by process user
php_value[session.save_handler] = files
php_value[session.save_path]    = /var/cache/php-fpm/session
php_value[soap.wsdl_cache_dir]  = /var/cache/php-fpm/wsdlcache
php_value[opcache.file_cache]   = /var/cache/php-fpm/opcache
php_value[opcache.interned_strings_buffer] = 32
php_value[opcache.memory_consumption] = 256
